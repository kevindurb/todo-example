name: OpenSpec smoke

on:
  workflow_dispatch:

concurrency:
  group: factory-smoke
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Show the OIDC claims
        shell: bash
        env:
          AUDIENCE: api.tailscale.com/${{ vars.TS_CLIENT_ID }}
        run: |
          set -euo pipefail
          response=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")
          token=$(jq -r .value <<< "$response")
          TOKEN="$token" python3 - <<'PY'
          import base64, json, os
          payload = os.environ["TOKEN"].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          keys = ("iss", "aud", "sub", "repository", "ref", "event_name", "workflow", "job_workflow_ref")
          print(json.dumps({key: claims.get(key) for key in keys}, indent=2))
          PY
      - name: Join the tailnet and check the model endpoint
        uses: ./.github/actions/openspec-agent
        with:
          agent: openspec-verify
          preflight-only: "true"
          tailscale-client-id: ${{ vars.TS_CLIENT_ID }}
          tailscale-audience: ${{ vars.TS_AUDIENCE }}
